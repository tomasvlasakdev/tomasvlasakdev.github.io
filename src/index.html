<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{t:meta.title}}</title>
{{REDIRECT}}
<meta name="description" content="{{t:meta.description}}">
<meta name="author" content="Tomáš Vlasák">
<link rel="canonical" href="{{PAGE_URL}}">
{{ALTERNATES}}
<meta property="og:type" content="website">
<meta property="og:title" content="{{t:meta.title}}">
<meta property="og:description" content="{{t:meta.og}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:image" content="{{SITE_URL}}beaver.png">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1b1f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/beaver.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/beaver.png">
<link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  (function () {
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  })();
</script>
<style>{{CSS}}</style>
</head>
<body>
<a class="skip" href="#work">{{t:ui.skip}}</a>

<div class="page">
{{BAR}}

  <main>
    <header class="hero">
      <div class="hero-text reveal" style="--i:0">
        <h1 class="name"><span>Tomáš</span> <span>Vlasák</span></h1>
        <p class="role">{{t:role}}</p>
      </div>
      {{AVATAR}}
    </header>

    <ul class="info reveal" style="--i:2" aria-label="{{t:ui.aboutMe}}">
{{INFO}}
    </ul>

    <ul class="links reveal" style="--i:3" aria-label="{{t:ui.findMe}}">
{{LINKS}}
    </ul>

    <section class="section" id="work" aria-labelledby="work-title">
      <h2 id="work-title">{{t:h.projects}}</h2>
      <ol class="projects">
{{PROJECTS}}
      </ol>
    </section>

    <section class="section" aria-labelledby="stack-title">
      <h2 id="stack-title">{{t:h.stack}}</h2>
      <dl class="stack">
{{STACK}}
      </dl>
    </section>

    <section class="section contact" id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">{{t:h.contact}}</h2>
      <div class="row">
        <div class="main">
          <p>{{t:contact.text}}</p>
          <a class="email" href="mailto:{{EMAIL}}">{{EMAIL}}</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>© {{YEAR}} Tomáš Vlasák. {{UPDATED}}</p>
    <p><a href="https://github.com/tomasvlasakdev/tomasvlasakdev.github.io">{{t:ui.sourceForSite}}</a></p>
  </footer>
</div>

<script>{{SITE_JS}}</script>
<script>
  (function () {
    var root = document.documentElement;

    // Tapping the beaver makes it gnaw (mouse users get this on hover, via CSS).
    var beaver = document.querySelector(".avatar"), gnawing;
    beaver.addEventListener("click", function () {
      beaver.classList.add("is-gnawing");
      clearTimeout(gnawing);
      gnawing = setTimeout(function () { beaver.classList.remove("is-gnawing"); }, 1600);
    });

    // Live local time in the Czech Republic, in the page's language.
    var clock = document.querySelector("[data-clock]");
    if (clock) {
      var lang = root.lang === "en" ? "en-GB" : root.lang;
      var fmt = new Intl.DateTimeFormat(lang, { hour: "2-digit", minute: "2-digit", timeZone: clock.dataset.clock });
      var zone = new Intl.DateTimeFormat(lang, { timeZoneName: "short", timeZone: clock.dataset.clock });
      var parts = clock.dataset.template.split("{time}");
      var tick = function () {
        var now = new Date();
        var z = (zone.formatToParts(now).find(function (p) { return p.type === "timeZoneName"; }) || {}).value || "";
        clock.textContent = "";
        clock.append(parts[0]);
        var t = document.createElement("time");
        t.textContent = fmt.format(now);
        clock.append(t, parts[1] + (z ? " (" + z + ")" : ""));
      };
      tick();
      setInterval(tick, 20000);
    }
  })();
</script>
</body>
</html>
