<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomáš Vlasák, student developer</title>
<meta name="description" content="Tomáš Vlasák is a student developer in the Czech Republic who builds full-stack web apps with TypeScript, React and Next.js.">
<meta name="author" content="Tomáš Vlasák">
<link rel="canonical" href="{{SITE_URL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="Tomáš Vlasák, student developer">
<meta property="og:description" content="Full-stack web apps with TypeScript, React and Next.js.">
<meta property="og:url" content="{{SITE_URL}}">
<meta property="og:image" content="{{SITE_URL}}beaver.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1b1f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="beaver.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="beaver.png">
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  (function () {
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  })();
</script>
<style>{{CSS}}</style>
</head>
<body>
<a class="skip" href="#work">Skip to projects</a>

<div class="page">
  <div class="bar">
    <button class="theme-toggle" type="button">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="visually-hidden theme-label">Switch to dark theme</span>
    </button>
  </div>

  <main>
    <header class="hero">
      <div class="hero-text reveal" style="--i:0">
        <h1 class="name"><span>Tomáš</span> <span>Vlasák</span></h1>
        <p class="role">{{ROLE}}</p>
      </div>
      <img class="avatar reveal" style="--i:1" src="beaver.svg" width="144" height="144" alt="Pixel-art beaver, Tomáš's mascot">
    </header>

    <ul class="info reveal" style="--i:2" aria-label="About me">
{{INFO}}
    </ul>

    <ul class="links reveal" style="--i:3" aria-label="Find me online">
{{LINKS}}
    </ul>

    <section class="section" id="work" aria-labelledby="work-title">
      <h2 id="work-title">Projects</h2>
      <ol class="projects">
{{PROJECTS}}
      </ol>
    </section>

    <section class="section" aria-labelledby="stack-title">
      <h2 id="stack-title">Tech stack</h2>
      <dl class="stack">
{{STACK}}
      </dl>
    </section>

    <section class="section contact" id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">Get in touch</h2>
      <div class="row">
        <div class="main">
          <p>Email is the quickest way to reach me. I usually reply within a day or two.</p>
          <a class="email" href="mailto:{{EMAIL}}">{{EMAIL}}</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>© {{YEAR}} Tomáš Vlasák. {{UPDATED}}</p>
    <p><a href="https://github.com/tomasvlasakdev/tomasvlasakdev.github.io">Source for this site</a></p>
  </footer>
</div>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector(".theme-toggle");
    var label = btn.querySelector(".theme-label");
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var still = window.matchMedia("(prefers-reduced-motion: reduce)");
    function isDark() {
      var t = root.dataset.theme;
      return t ? t === "dark" : media.matches;
    }
    function sync() {
      var dark = isDark();
      root.classList.toggle("is-dark", dark);
      label.textContent = dark ? "Switch to light theme" : "Switch to dark theme";
    }
    function flip() {
      var next = isDark() ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      sync();
    }
    btn.addEventListener("click", function () {
      if (!document.startViewTransition || still.matches) return flip();
      // Reveal the new theme as a circle growing out of the button.
      var r = btn.getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 2;
      var end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.startViewTransition(flip).ready.then(function () {
        root.animate(
          { clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + end + "px at " + x + "px " + y + "px)"] },
          { duration: 550, easing: "cubic-bezier(.4,0,.2,1)", pseudoElement: "::view-transition-new(root)" }
        );
      });
    });
    if (media.addEventListener) media.addEventListener("change", sync);
    sync();

    // Live local time in the Czech Republic.
    var clock = document.querySelector("[data-clock]");
    if (clock) {
      var fmt = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: clock.dataset.clock });
      var zone = new Intl.DateTimeFormat("en-GB", { timeZoneName: "short", timeZone: clock.dataset.clock });
      var tick = function () {
        var now = new Date();
        var z = (zone.formatToParts(now).find(function (p) { return p.type === "timeZoneName"; }) || {}).value || "";
        clock.innerHTML = "It's <time>" + fmt.format(now) + "</time> here" + (z ? " (" + z + ")" : "");
      };
      tick();
      setInterval(tick, 20000);
    }
  })();
</script>
</body>
</html>
